name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reference data
        run: npm run build
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate data and application rendering
        run: npm test
      - name: Verify generated documentation
        run: |
          npm run docs
          git diff --exit-code -- docs/COVERAGE.md SOURCES.md
